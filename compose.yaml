services:
  postgres:
    image: postgres:15
    container_name: eton-dev-postgres
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: eton-dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  pgadmin_data:
